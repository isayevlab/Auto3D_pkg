version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"

python:
  install:
    # One resolution, from pyproject.toml's extras. The `docs/requirements.txt`
    # that used to be installed first re-declared torch, rdkit, pandas, ase and
    # torchani with floors that contradicted pyproject.toml, so Read the Docs
    # and CI could build against different versions of the package they
    # document.
    - method: pip
      path: .
      extra_requirements:
        - ase
        - ani
        - docs

# conda:
#   environment: installation.yml

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - pdf
  - epub
