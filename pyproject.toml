[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Auto3D"
version = "3.0.0"
description = "Generating Low-energy 3D Conformers from SMILES/SDF"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zhen Liu", email = "liu5@andrew.cmu.edu"},
    {name = "Tetiana Zubatiuk", email = "tetiana@zubatyuk.com"},
    {name = "Adrian Roitberg", email = "roitberg@ufl.edu"},
    {name = "Olexandr Isayev", email = "olexandr@olexandrisayev.com"},
]
maintainers = [
    {name = "Olexandr Isayev", email = "olexandr@olexandrisayev.com"},
]
keywords = [
    "chemistry",
    "molecular-dynamics",
    "conformer-generation",
    "neural-network-potentials",
    "cheminformatics",
    "drug-discovery",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "tqdm>=4.60.0",
    "psutil>=5.8.0",
    "Send2Trash>=1.8.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "rdkit>=2022.9.5",
    "torch>=2.8",
    "aimnet>=0.2",
    "requests>=2.32.3",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ani = [
    "torchani>=2.8",
]
ase = [
    # 3.23.0, not 3.22.1: IdealGasThermo gained `ignore_imag_modes` in 3.23.0,
    # and Auto3D.ASE.thermo passes it -- on 3.22.1 that call raises TypeError.
    # 3.22.1 also slices the last 3N-6 of the input list without sorting it
    # first, a third distinct mode-selection semantics. Verified against the
    # 3.22.1 and 3.23.0 wheels.
    "ase>=3.23.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3.0",
    "nbsphinx>=0.9.0",
    "myst-parser>=2.0",
]
all = [
    "Auto3D[ani,ase,dev,docs]",
]

[project.scripts]
auto3d = "Auto3D.auto3Dcli:cli"

[project.urls]
Homepage = "https://github.com/isayevlab/Auto3D_pkg"
Documentation = "https://auto3d.readthedocs.io"
Repository = "https://github.com/isayevlab/Auto3D_pkg"
"Bug Tracker" = "https://github.com/isayevlab/Auto3D_pkg/issues"
Changelog = "https://github.com/isayevlab/Auto3D_pkg/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
Auto3D = ["models/*.pt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (needed for sys.path manipulation)
    "E741",   # ambiguous variable name (scientific notation l, I, O)
    "N801",   # class name should use CapWords (legacy code compatibility)
    "N802",   # function name should be lowercase (legacy API compatibility)
    "N803",   # argument name should be lowercase (scientific computing conventions)
    "N806",   # variable name should be lowercase (scientific computing conventions)
    "N815",   # mixedCase variable (scientific notation like pKa)
    "N999",   # invalid module name (Auto3D is the package name)
    "SIM102", # nested if (sometimes clearer)
    "SIM103", # return condition directly (explicit is clearer)
    "SIM105", # contextlib.suppress (try-except-pass is clearer for optional imports)
    "SIM108", # ternary operator (less readable for complex conditions)
    "SIM110", # any/all (explicit loops can be clearer)
    "SIM115", # context manager for open (sometimes not applicable)
    "SIM118", # key in dict instead of dict.keys()
    "B007",   # unused loop variable (intentional in some cases)
    "B008",   # function call in default argument (torch.device is acceptable)
    "B028",   # stacklevel in warnings (not always needed)
    "B904",   # raise from in except (not always needed)
    "C403",   # set comprehension (list comprehension is often clearer)
    "C408",   # dict() call (more readable with keyword arguments)
    "C416",   # list comprehension (intentional in some cases)
    "C417",   # map usage (sometimes clearer than list comprehension)
    "UP031",  # format specifiers (% format is fine for simple cases)
]

[tool.ruff.lint.per-file-ignores]
# Task 11 (CI wiring) put `tests/` under `ruff check` for the first time. Bare
# `except:` blocks (E722) were fixed directly -- a narrow, mechanical swap to
# `except OSError:`/`except ImportError:` at each site. Everything below is
# pre-existing style debt spread across most test files (not specific to the
# newly-gated modules); fixing it is a wholesale test-suite reformat out of
# scope for a CI-wiring change, so it is narrowed here instead of edited.
#
# F811 (redefined-while-unused) and SIM222 (`... or True`) were deliberately
# NOT added here, even though both fired in tests/. A fix-round review found
# each one was flagging a real, currently-active bug rather than a style
# nit -- a duplicate `TestCombineSmi` class silently shadowing another
# class's test, and a vacuous `assert ... or True` that could never fail.
# Both were fixed at the source instead (see git history), and both codes
# stay enabled for tests/ so a regression here is caught by lint again.
"tests/*" = [
    "I001",   # unsorted imports -- reordering would touch most test files
    "F401",   # unused imports (legacy test scaffolding, e.g. optional-dep guards)
    "E712",   # `== True`/`== False` comparisons (common in older tests)
    "E702",   # multiple statements on one line (semicolons in legacy tests)
    "B017",   # assertRaises(Exception) -- broad but intentional in smoke tests
    "F841",   # unused local variables (e.g. captured-for-inspection results)
    "N816",   # mixedCase globals (e.g. `test_userNNP1` availability flags)
    "UP008",  # super() with parameters (legacy style, harmless)
    "SIM117", # nested `with` statements (sometimes clearer split out)
    "N811",   # constant imported as non-constant (legacy aliasing)
    "B905",   # zip() without strict= (pre-3.10-style call sites)
    "E401",   # multiple imports on one line
    "N813",   # camelCase import aliased to lowercase
    "SIM300", # yoda conditions
]

[tool.ruff.lint.isort]
known-first-party = ["Auto3D"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
    "example/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Auto3D's own deprecation and chemistry warnings are public contract and
    # must stay visible so tests can assert them (audit M34).
    "default::DeprecationWarning:Auto3D.*",
    "default::UserWarning:Auto3D.*",
    # Third-party noise we do not control.
    "ignore:.*pkg_resources is deprecated.*:DeprecationWarning",
    "ignore:.*Importing 'parser.split_arg_string' is deprecated.*:DeprecationWarning",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:ase.*",
    "ignore::UserWarning:torch.*",
]

[tool.coverage.run]
source = ["src/Auto3D"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
