name: Tests

on:
  pull_request:
  schedule:
    # Weekly on main: the full interpreter matrix, the slow tier and the
    # model-weight cache refresh. Pull requests run the gates below on every
    # push; a merge commit is not run again because branch protection requires
    # the branch to be up to date, so the tree that merges is the tree that was
    # tested (41 of 41 merge commits over 55 days had the PR head's tree).
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Supersede a pull request's own earlier pushes only. `github.ref` is
  # refs/pull/<n>/merge on a pull request, so the group is per pull request
  # and fork-safe; a scheduled or dispatched run on main is never canceled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (py${{ matrix.python }}, ani=${{ matrix.ani }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Two legs on two axes for a pull request: the interpreter floor without
      # the optional torchani dependency, and 3.12 with it (where mypy runs).
      # Both ani=false legs used to run; over 55 days they never disagreed, and
      # the only leg-specific failure was on ani=false (two tests missing an
      # importorskip), which the floor leg still catches. The weekly run adds
      # 3.12 without torchani and 3.13 with and without it: pyproject.toml
      # advertises 3.13 and nothing verified it.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"python":"3.11","ani":false,"extras":"ase,dev"},{"python":"3.12","ani":true,"extras":"ase,ani,dev"}]}' || '{"include":[{"python":"3.11","ani":false,"extras":"ase,dev"},{"python":"3.12","ani":false,"extras":"ase,dev"},{"python":"3.12","ani":true,"extras":"ase,ani,dev"},{"python":"3.13","ani":false,"extras":"ase,dev"},{"python":"3.13","ani":true,"extras":"ase,ani,dev"}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          # No `cache: pip` here, unlike every other job in this file: the
          # install below is uv, which does not read pip's HTTP cache, so
          # restoring that 627 MB blob would cost about 5 s of this job's setup
          # to feed a tool that never looks at it. The 3.12 entry is still
          # written by the jobs that do use pip (`no-aimnet`, `slow-shards`,
          # and the documentation workflow), so nothing else loses its cache.
      - name: Install
        # The runners have no GPU, and every test runs on CPU or monkeypatches
        # torch.cuda. The default wheel brings the CUDA 13 build: torch at
        # 555 MB, about 1.9 GB of nvidia_* wheels and triton at 248 MB, fetched
        # by every job that installs torch. With PyTorch's CPU wheel index as an
        # extra index, the `+cpu` build of a release outranks the plain one, so
        # whichever torch version the resolution lands on (torchani caps it
        # below the newest) arrives as the CPU build; each install dropped from
        # 92-149 s to 76-94 s when that index was added. One project install,
        # not one per extra: installing `[ani]` after `[ase,dev]` made the
        # resolver replace a working torch because of that cap, 45 s and 0.9 GB
        # per run to end where one resolution ends.
        #
        # uv rather than pip, and on these two legs only. pip against a warm
        # 627 MB HTTP cache took 55-81 s across the five jobs; uv with no cache
        # at all took 47 s, because it resolves once and downloads and unpacks
        # in parallel. `pip install uv` keeps the install to tools already
        # trusted here -- a marketplace action would be one more thing to pin by
        # SHA and keep in Dependabot's scope for a 3 s saving.
        #
        # `--index-strategy unsafe-best-match` is load-bearing, not tuning:
        # uv's default stops at the first index that has a package at all, and
        # the PyTorch index carries a `requests` (2.28.1) far below this
        # project's floor, so the default resolves nothing and the install
        # fails outright. The flag makes uv consider every version on every
        # index -- which is exactly the posture `pip --extra-index-url` has had
        # here all along, so it is not a regression, but the name is a warning
        # rather than decoration and the alternative (pinning the CPU index to
        # torch alone in pyproject.toml) would hand contributors on GPU boxes a
        # CPU torch.
        #
        # The resolution is unchanged, checked rather than assumed: uv and pip
        # both land on torch 2.13.0+cpu and torchani 2.9.0, with no `nvidia_*`
        # and no `triton`, and a freeze of each environment differs in nothing.
        run: |
          # No `pip install --upgrade pip` first: the only thing pip installs
          # here is uv, which the bundled pip handles, and the self-upgrade was
          # 4-5 s of the step it used to open.
          pip install uv
          # --system because there is no virtual environment on a runner and uv
          # refuses to touch an interpreter it was not pointed at; this is the
          # setup-python interpreter the steps below will run.
          uv pip install --system --index-strategy unsafe-best-match \
            -e ".[${{ matrix.extras }}]" \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Verify every test module imports
        # --continue-on-collection-errors on the fast run hides a module that
        # fails to import, so assert collection cleanliness separately.
        run: pytest tests/ --collect-only -q
      - name: Run fast tests
        run: pytest tests/ -q -m "not slow" --continue-on-collection-errors --durations=0
      - name: TEMPORARY resolved dependency set
        run: uv pip freeze --system

      # Here rather than in `lint`, because this job is the only one that
      # installs the dependencies. mypy resolves a third-party import to `Any`
      # when the package is absent, so a dep-free run cannot see a wrong tensor,
      # array or ASE argument at all -- it reported 40 errors where a run with
      # the extras present reports 66, and the 26 it missed are precisely the
      # ones a type checker is worth having here for.
      #
      # Only on the `ani` leg: near-identical reports are noise, and this is the
      # leg with the most complete type information. Running it under 3.12 does
      # not weaken the floor -- `python_version = "3.11"` in pyproject.toml is
      # what decides the semantics checked, not the interpreter.
      #
      # Not on pull requests. The step ends in `|| true`, so it has never been
      # able to fail one; what it produced was a count against a known backlog,
      # on a path where 20 s is a sixth of the leg's budget. The signal is only
      # worth having when somebody is going to read it, which is when the
      # backlog is worked on -- so it stays on the weekly run and on manual
      # dispatch, where nothing is waiting on the answer. Flipping `|| true`
      # off is still what gates moving it back: a step that can fail a pull
      # request belongs on a pull request.
      - name: mypy (non-blocking until type debt is cleared)
        if: matrix.ani && github.event_name != 'pull_request'
        run: mypy src/Auto3D/ || true

  no-aimnet:
    # The conda-forge package will ship Auto3D's dependency set minus aimnet
    # plus torchani and ase -- aimnet cannot be packaged for conda-forge (its
    # dependency nvalchemi-toolkit-ops is pip-only). conda-recipe/meta.yaml is
    # updated to that shape as part of the 3.1.1 release. This job emulates
    # that environment and is the enforcement mechanism for the no-aimnet
    # path: without it, the path rots the first time someone adds a
    # module-level `import aimnet`.
    #
    # `pip uninstall -y aimnet` below leaves aimnet's own transitive
    # dependencies installed, so this emulation cannot catch code that leans
    # on a package that only arrives via aimnet's dependency tree -- the
    # genuine conda build is the true gate for that.
    #
    # It is a required check on `main`, so a module-level `import aimnet`
    # cannot merge.
    name: no-aimnet (conda package environment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install, then remove aimnet
        # One project install for every extra at once, with PyTorch's CPU wheel
        # index as an extra index so the resolved torch arrives as its `+cpu`
        # build, for the reasons spelled out on the `test` job's install step.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ani,ase,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
          pip uninstall -y aimnet
      - name: Bare import works without aimnet
        run: python -c "import Auto3D"
      - name: Whole-suite collection stays clean without aimnet
        run: pytest tests/ --collect-only -q
      - name: No-aimnet behavior tests
        run: pytest tests/test_no_aimnet.py -q
      - name: ANI2xt still constructs (bundled weights, no download)
        run: pytest "tests/test_model_factory.py" -q -k "ani2xt"

  slow-shards:
    name: slow shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # The slow tier set the critical path of all 8 runs measured across two
    # weeks, PR and scheduled alike: a median 505 s against 207 s for the
    # runner-up, with `pytest -m slow` itself 81% of the job. The time is
    # spread evenly inside each heavy file, so there was no single test to
    # speed up -- four shards on four runners take the tier to roughly 235 s,
    # which is then what the whole run costs.
    #
    # Sharding across jobs rather than with xdist inside one job is the point,
    # not an accident. Each shard gets its own runner and its own filesystem,
    # so the modules that still write job directories into tests/files/ cannot
    # interfere with anything; and the end-to-end tests fork worker processes
    # of their own, which on 4 vCPUs would be competing with xdist workers for
    # the same cores and could turn a timing test into a flake.
    #
    # Shard names must stay distinct from each other. publish.yml's release
    # gate reduces a commit's check runs with
    # `group_by(.name) | map(max_by(.completed_at))`, so legs sharing one name
    # would collapse to whichever finished last and a red shard could be
    # masked by a green one. The protected name lives on the single `slow`
    # check below instead.
    #
    # These tests are NNP inference on CPU, so their wall time tracks whatever
    # share of the runner we get. Three consecutive runs of the same commit
    # took 6m21s, 17m57s and 6m52s for the whole tier: the middle one exceeded
    # the old 20-minute ceiling and was canceled *after* every test had passed,
    # reporting a red slow tier for code that was fine. A job that fails on
    # runner luck teaches people to ignore it, which is worse than a job that
    # is slow. For the whole tier, 45 minutes was about 5x its median and 2.5x
    # that worst observed run. A shard is a quarter of the tests plus the same
    # fixed ~100 s of setup, install and model warm, so 20 minutes holds both
    # of those ratios rather than tightening them.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Two lists that have to move in lockstep: `select` names the files a
      # shard runs, and the last leg takes `tests/` minus exactly those files.
      # The asymmetry is the thing to remember -- a file named in a shard but
      # left out of the ignore list merely runs twice, while a file in the
      # ignore list that no shard names runs *never*, silently. Adding a slow
      # test to a file that appears in neither list needs no change here at
      # all: the catch-all picks it up. Re-balance when the catch-all grows
      # past the heaviest named shard; the medians below are what the split is
      # fitted to.
      matrix:
        include:
          # 120 s of tests, the heaviest file in the tier.
          - shard: "1 of 4 (end-to-end pipeline)"
            group: pipeline-e2e
            select: tests/test_pipeline_e2e.py
          # 93 s. Deliberately not with the file above: those two alone are
          # 53% of the tier, so they have to land on different runners. Safe to
          # isolate because test_auto3D.py runs every pipeline test through the
          # job_dir/isolated_input fixtures, so it writes no job directories or
          # output SDFs into tests/files/ -- the reason the tier stopped being
          # limited to three files in the first place.
          - shard: "2 of 4 (main and smiles2mols)"
            group: auto3d
            select: tests/test_auto3D.py
          # 41 + 33 + 28 = 102 s, the three next-heaviest files. test_thermo.py
          # stages its opt_geometry inputs in tmp_path, so it is isolable for
          # the same reason test_auto3D.py is.
          - shard: "3 of 4 (workers, compile, thermo)"
            group: workers-thermo
            select: tests/test_worker_lifecycle.py tests/test_compile_values.py tests/test_thermo.py
          # The other 22 files, about 85 s, plus anything added later.
          #
          # test_SPE.py, test_isomer_engine.py and test_tauto.py all live here,
          # in the order a full run gives them. They are the three modules that
          # still write job directories into tests/files/ rather than going
          # through the job_dir/isolated_input fixtures, so what protects them
          # is main()'s microsecond-resolution job naming, serial execution and
          # the autouse GPU-teardown fixture the `slow` marker applies --
          # assessed at 70-80% confidence, not guaranteed. One shard, same
          # order, so that is unchanged; separate shards would also be safe
          # from each other, but there is no reason to find out.
          - shard: "4 of 4 (everything else)"
            group: rest
            select: >-
              tests/
              --ignore=tests/test_pipeline_e2e.py
              --ignore=tests/test_auto3D.py
              --ignore=tests/test_worker_lifecycle.py
              --ignore=tests/test_compile_values.py
              --ignore=tests/test_thermo.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache downloaded model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # AIMNet2 weights download to ~/.cache/aimnet; torchani/torch.hub
          # weights (ANI2x) land in ~/.cache/torch. Cache both so the slow
          # suite does not re-download on every run. Every shard restores the
          # same 31 MB entry, which is a cache hit and no network.
          path: |
            ~/.cache/aimnet
            ~/.cache/torch
          key: nnp-model-cache-v1
      - name: Install
        # One project install for every extra at once, with PyTorch's CPU wheel
        # index as an extra index so the resolved torch arrives as its `+cpu`
        # build, for the reasons spelled out on the `test` job's install step.
        run: |
          python -m pip install --upgrade pip
          # ase for thermo, ani for the torchani-gated slow tests, dev for
          # pytest and for nbmake, used by the notebook step below
          pip install -e ".[ase,ani,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: The shard selections still partition the slow tier
        # The matrix above is two lists that have to agree, and the dangerous
        # direction is silent: a file in the catch-all's ignore list that no
        # shard names runs *never*, with no job failing and no count looking
        # wrong. A comment cannot enforce that, so this re-derives the
        # partition from collection alone -- it runs no tests, costs about 30 s
        # of imports, and reads the shard arguments out of this file, so the
        # check cannot drift from the matrix it checks.
        #
        # Before the model warm and the test run, so a broken selection
        # reports in half a minute instead of behind a suite. On the catch-all
        # leg only: every leg would compute the same answer, and this is the
        # leg that owns the ignore list.
        if: matrix.group == 'rest'
        run: python .github/scripts/assert_slow_shards_partition.py
      - name: Warm the AIMNet2 model cache (hard failure if unreachable)
        # An unavailable gate must never be reportable as a passing gate. If the
        # registry or network is down, fail here loudly rather than letting the
        # suite skip or silently pass. Three attempts with a pause between them
        # absorb a transient outage; a persistent one still fails the job.
        run: |
          for attempt in 1 2 3; do
            python - <<'PY' && break
          import sys
          import torch
          from Auto3D.engines.model_factory import create_model
          try:
              create_model("AIMNET", torch.device("cpu"))
              create_model("aimnet2-nse", torch.device("cpu"))
          except Exception as exc:
              print(f"::warning::AIMNet2 model unavailable on this attempt: {exc}")
              sys.exit(1)
          print("AIMNet2 model cache warm")
          PY
            if [ "$attempt" = 3 ]; then
              echo "::error::AIMNet2 model unavailable after 3 attempts, gate cannot run"
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Run slow NNP + pipeline tests
        # matrix.select expands unquoted on purpose: it is one or more paths,
        # plus the catch-all leg's --ignore flags, and the shell has to word
        # split it into pytest arguments. Every value is a literal written
        # above. Explicit paths also override `testpaths`, which is why a
        # targeted shard collects in a fraction of a second.
        #
        # A shard whose files were all renamed away would collect nothing;
        # pytest exits 5 for that and nothing here suppresses it, so such a
        # shard reports red rather than passing empty.
        run: pytest ${{ matrix.select }} -m slow -q

      # Executes one notebook for real. Here rather than in the docs workflow
      # because every one of the 20 needs a neural network potential, and this
      # is the only job with the model cache and the `ani` extra. On the
      # catch-all shard only -- it is the lightest one, and the notebook is
      # three seconds of signal that does not need running four times.
      #
      # One, and the selection was measured on a CPU box with CUDA hidden --
      # which is what a runner is -- rather than on a machine with a GPU. The
      # dividing line is not notebook size, it is whether the notebook runs an
      # optimization:
      #
      #   single_point_energy   (calc_spe, 4 records)     5.9 s
      #   geometry_optimization (opt_geometry, 4 records)  > 600 s
      #
      # The same optimization notebook takes 74 s on a GPU, which is how it
      # first looked affordable. Every other notebook either optimizes or runs
      # `main()` end to end, so all of them land on the wrong side of that line;
      # those paths are covered by the slow test tier above instead.
      #
      # What this closes: this notebook calling a function Auto3D no longer has,
      # or passing an argument it no longer accepts, now fails here. What it
      # does not: the other 19 are still parse-checked only, so the guard in
      # tests/test_notebook_properties.py remains the only thing covering all
      # 20 -- and it catches a wrong SD property name, not a wrong call.
      - name: Execute the single-point notebook
        if: matrix.group == 'rest'
        run: |
          pytest --nbmake --nbmake-timeout=600 example/single_point_energy.ipynb

  slow:
    # The protected name, and the whole reason this job exists. Branch
    # protection on main requires a check named exactly "slow tests (NNP
    # integration)" and publish.yml's release gate looks for the same string on
    # the tagged commit, so the name cannot move onto the shards -- and must
    # not be duplicated across them either, per the note on the matrix above.
    # This job runs no tests. It carries the name, as one check run, and
    # refuses to be green unless every shard was.
    name: slow tests (NNP integration)
    needs: slow-shards
    # Required, not defensive: without it the gate is skipped whenever a shard
    # fails, and a skipped required check never reports at all -- branch
    # protection would sit waiting for a verdict that is not coming instead of
    # showing the failure.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every slow shard succeeded
        # `needs.<matrix job>.result` is the aggregate over all legs: `success`
        # only when every one of them succeeded, `failure` when any failed, and
        # `cancelled` or `skipped` when they did not run. Everything other than
        # `success` is red here, because a shard that did not run is not a
        # shard that passed.
        env:
          SHARDS: ${{ needs.slow-shards.result }}
        run: |
          echo "slow shards: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::the slow tier did not pass: shards concluded '$SHARDS'"
            exit 1
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # ruff needs no dependencies installed; mypy does, so it runs in the
      # `test` job instead. See the note on that step.
      # Pinned exactly, and matching the `dev` extra in pyproject.toml, because
      # `ruff format --check` is a gate: ruff promotes formatting-style changes
      # into its stable style across minor releases, with settings unchanged.
      # An unpinned install turns any such release into a red build on whichever
      # unrelated pull request happens to be open that day -- the same
      # fails-on-luck failure mode the slow job's timeout comment describes.
      #
      # Bumping it is a deliberate act: raise all three pins together --
      # `pyproject.toml`'s dev extra, this job, and `rev` in
      # `.pre-commit-config.yaml`, because a contributor installs the hook from
      # that file and a stale hook formats with a style this gate rejects. If
      # the new version reformats anything, that reformat is its own commit and
      # its own `.git-blame-ignore-revs` entry.
      - name: Install tooling
        run: pip install ruff==0.15.9
      - name: ruff check
        run: ruff check src/Auto3D/ tests/

      # CONTRIBUTING.md has told contributors to run `ruff format src/ tests/`
      # since long before anything checked. Nothing did, so the tree drifted
      # until the documented command produced a 169-file diff -- at which point
      # nobody could follow the instruction on an ordinary pull request, and the
      # drift compounded. The gate is the half that makes the instruction true.
      #
      # Unlike the mypy step, this one does NOT end in `|| true`. It starts from
      # zero and the fix is one command, so there is no debt to grandfather.
      - name: ruff format
        run: ruff format --check src/ tests/
