name: Documentation

# No `push:` trigger: Read the Docs builds `main` from `.readthedocs.yaml`, and
# the uploaded artifact had no consumer; the post-merge build repeated the pull
# request build on the same tree.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'example/**'
      - '.readthedocs.yaml'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Documentation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        # The runner image already carries pandoc; the guard installs it only if
        # a future image does not. `apt-get update` alone costs about 10 s.
        run: command -v pandoc >/dev/null || { sudo apt-get update && sudo apt-get install -y pandoc; }

      - name: Install dependencies
        # One project install for every extra at once, with PyTorch's CPU wheel
        # index as an extra index so the resolved torch arrives as its `+cpu`
        # build, for the reasons spelled out on the install step of the `test`
        # job in tests.yml.
        #
        # `docs/requirements.txt` used to be installed on top of `pip install
        # -e .`: it re-declared torch, rdkit, pandas, ase and torchani with
        # floors that contradicted `pyproject.toml` -- `ase>=3.22.1` against the
        # documented `>=3.23.0` -- and fetched torch twice. The `docs` extra is
        # now the one list, shared with Read the Docs.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ase,ani,docs]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build Sphinx documentation
        # One build, teed once. A second `make html` is incremental, the
        # doctrees from the first are still on disk, so its log cannot contain
        # the first build's diagnostics; the old "check for warnings" step
        # grepped an empty log. The grep is the gate because sphinx-build
        # returns 0 for ERROR-level messages unless warnings are fatal, and
        # autodoc reports a module it cannot import at WARNING level, which is
        # exactly what a rename under src/ causes and exactly what an
        # ERROR-only grep missed: the API page could vanish and the job stayed
        # green.
        run: |
          set -o pipefail
          make -C docs html 2>&1 | tee docs/build.log
          if grep -q "ERROR" docs/build.log; then
            echo "::error::the documentation build reported an error"
            exit 1
          fi
          if grep -q -E "(autodoc|autosummary): failed to import" docs/build.log; then
            echo "::error::autodoc could not import a module; the API reference is incomplete"
            exit 1
          fi

  linkcheck:
    name: Check Links
    # Weekly and on demand, and allowed to be red: external link rot is not a
    # property of a pull request's diff, which is why this job used to be wired
    # to pass unconditionally, at 4 minutes of runner time and 4 minutes of
    # merge delay on every pull request for a result nobody could act on. On a
    # schedule a red result is actionable. Rot in third-party pages goes in
    # `linkcheck_ignore` in `docs/source/conf.py`, with the reason, not back
    # into a suppression here.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: command -v pandoc >/dev/null || { sudo apt-get update && sudo apt-get install -y pandoc; }

      - name: Install dependencies
        # Same shape and the same reasons as the `build` job above.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ase,ani,docs]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check links
        run: make -C docs linkcheck
