name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit is tested and versioned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        # The release tag is the only thing that selects what ships; a tag that
        # disagrees with pyproject.toml used to be found by PyPI's rejection,
        # after the build.
        #
        # The tag arrives through the environment, not interpolated into the
        # script: it is release metadata, and an expression expanded into a
        # shell body is expanded before the shell ever quotes it.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag $TAG does not match project.version $version"
            exit 1
          fi
      - name: The tagged commit passed the merge gates
        # Pull requests are tested on their head; a merge commit on main is not
        # run again (branch protection keeps the branch up to date, so the
        # merged tree is the tested tree). For a merge commit the check runs
        # live on its second parent; for a direct commit, on itself. Every
        # required context must have succeeded: a check still running reports
        # "in progress" and one that never ran reports "missing", and both fail
        # the gate, because neither is a pass.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if git rev-parse --verify -q HEAD^2 >/dev/null; then sha=$(git rev-parse HEAD^2); fi
          echo "checking $sha"
          runs=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs?per_page=100" --jq '.check_runs | group_by(.name) | map(max_by(.completed_at)) | map({name, conclusion})')
          echo "$runs"
          for ctx in "ruff" "pytest (py3.11, ani=false)" "pytest (py3.12, ani=true)" "slow tests (NNP integration)" "no-aimnet (conda package environment)"; do
            c=$(jq -r --arg n "$ctx" '[.[] | select(.name==$n) | (.conclusion // "in progress")][0] // "missing"' <<<"$runs")
            if [ "$c" != "success" ]; then
              echo "::error::required check '$ctx' is '$c' on $sha"
              exit 1
            fi
          done

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Check the distribution metadata
        # twine's own reader, run before PyPI's: a README it cannot render is
        # rejected at upload, after the artifact has been built and stored.
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Install the wheel into a clean environment and import it
        # The conda recipe runs `import Auto3D` and `auto3d --help` on its
        # artifact; the PyPI artifact had no such check. CPU torch through the
        # extra index, as in the test jobs.
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-check/bin/python -c "import Auto3D; print(Auto3D.__version__)"
          /tmp/wheel-check/bin/auto3d --help > /dev/null

      - name: Store distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/Auto3D
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      # Pinned by TAG, not by commit SHA -- deliberately, and unlike every
      # other action in this repository.
      #
      # This is a Docker-based action: it derives its own image reference from
      # the ref it was invoked with, so `@<sha>` makes it pull
      # ghcr.io/pypa/gh-action-pypi-publish:<sha>. Upstream publishes images
      # tagged by VERSION only, so no such image exists and the pull fails with
      # `manifest unknown` -- after a successful build, before PyPI is ever
      # contacted. Verified against the registry: the v1.14.2 and v1.14.1 SHA
      # tags both 404, while `v1.14.2` and `v1.14.1` both resolve.
      #
      # checkout/setup-python/upload-artifact above stay SHA-pinned: they are
      # JavaScript actions, where the ref selects code rather than an image.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
