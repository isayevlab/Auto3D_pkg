# Auto3D Example Configuration File
# Replace with your input file path
path: "tests/files/smiles2.smi"

# Output selection (k and window are mutually exclusive - specify only one)
k: 1
window: None

# General settings
memory: None
capacity: 42

# Tautomer enumeration settings
enumerate_tautomer: False
tauto_engine: 'rdkit'
pKaNorm: True

# Stereoisomer enumeration settings
isomer_engine: rdkit
max_confs: None
enumerate_isomer: True
mode_oe: 'classic'
mpi_np: 4

# Optimization settings
# optimizing_engine accepts: AIMNET (alias for aimnet2), any aimnet registry
# name (aimnet2, aimnet2-2025, aimnet2-nse, aimnet2-pd, ...), ANI2x, ANI2xt,
# or a path to a custom NNP model file.
optimizing_engine: 'AIMNET'
use_gpu: True
gpu_idx: [0]
opt_steps: 2000
convergence_threshold: 0.01
patience: 250
batchsize_atoms: 1024

# Parallel conformer embedding
# Off by default: enabling it spawns worker processes, which changes a run's
# resource profile. Runs stay serial below parallel_embedding_threshold
# molecules even when it is on, since spawning costs more than it saves there.
use_parallel_embedding: False
parallel_workers: 4
parallel_embedding_threshold: 10

# Performance settings
allow_tf32: False

# Duplicate removal and output settings
threshold: 0.3
verbose: False
job_name: ""
