name: auto3D
channels:
  - conda-forge
dependencies:
  # Capped below 3.15 so the environment gets AIMNet2. aimnet's dependency
  # nvalchemi-toolkit-ops declares requires-python <3.15, so from 3.2.4 pip
  # installs Auto3D on 3.15 without aimnet. Uncapped, conda picks the newest
  # Python. Raise the cap together with AIMNET_PYTHON_CEILING
  # (engines/models/availability.py) once upstream lifts its cap.
  - python>=3.11,<3.15
  - pip
  - pip:
      # The >=3.0 floor makes an unsatisfiable environment fail loudly.
      # Without it pip falls back to 2.3.1, the newest release that does not
      # need aimnet, which then fails at import time.
      - "Auto3D[ani,ase]>=3.0"
